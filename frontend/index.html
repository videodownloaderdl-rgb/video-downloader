<!doctype html>
<html lang="es">
  <head>

    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- =================================================
         INFORMACIÓN PRINCIPAL
    ================================================== -->

    <title>
      Video DL - Descarga videos y audio
    </title>

    <meta
      name="description"
      content="Video DL permite procesar contenido disponible públicamente y descargarlo en diferentes formatos y calidades cuando tengas autorización para utilizarlo."
    />

    <meta
      name="keywords"
      content="descargar videos, descargar audio, MP4, MP3, video downloader"
    />

    <meta
      name="author"
      content="Video DL"
    />

    <meta
      name="robots"
      content="index, follow"
    />


    <!-- =================================================
         FAVICON
    ================================================== -->

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />


    <!-- =================================================
         COLOR DEL NAVEGADOR
    ================================================== -->

    <meta
      name="theme-color"
      content="#080b14"
    />

    <meta
      name="color-scheme"
      content="dark"
    />


    <!-- =================================================
         OPEN GRAPH
         Para compartir la página en redes sociales
    ================================================== -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Video DL - Descarga videos y audio"
    />

    <meta
      property="og:description"
      content="Procesa contenido disponible públicamente y descarga archivos en formatos compatibles cuando tengas autorización."
    />

    <meta
      property="og:url"
      content="/"
    />


    <!-- =================================================
         TWITTER / X
    ================================================== -->

    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="Video DL - Descarga videos y audio"
    />

    <meta
      name="twitter:description"
      content="Una herramienta sencilla para procesar contenido disponible públicamente."
    />


    <!-- =================================================
         PRECONEXIÓN
         Preparación para servicios externos
    ================================================== -->

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />


  </head>


  <body>

    <div id="root"></div>


    <script
      type="module"
      src="/src/main.jsx"
    ></script>

  </body>
</html>
